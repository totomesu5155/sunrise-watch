name: Sunrise Izumo Watch

on:
  schedule:
    - cron: '7-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_ntfy:
        description: 'e5489を見ずにntfyだけテストする'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sunrise-izumo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
      TRIP_LABEL: ${{ secrets.TRIP_LABEL }}
      DEPART_STATION: ${{ secrets.DEPART_STATION }}
      ARRIVE_STATION: ${{ secrets.ARRIVE_STATION }}
      TRAVEL_DATE: ${{ secrets.TRAVEL_DATE }}
      DEPART_HOUR: ${{ secrets.DEPART_HOUR }}
      DEPART_MINUTE: ${{ secrets.DEPART_MINUTE }}
      STATE_FILE: .state/sunrise_state.json
      SUNRISE_MAX_ATTEMPTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: sunrise-state-${{ github.run_id }}
          restore-keys: |
            sunrise-state-

      - name: Install Python package
        run: python -m pip install -r requirements.txt

      - name: Install Chromium OS dependencies
        run: python -m playwright install-deps chromium

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run ntfy test
        if: github.event_name == 'workflow_dispatch' && inputs.test_ntfy == true
        run: python sunrise_watch_actions.py --test-ntfy

      - name: Dense monitor
        if: github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true
        shell: bash
        run: |
          hour=$(TZ=Asia/Tokyo date +%H)
          minute=$(TZ=Asia/Tokyo date +%M)
          now_minutes=$((10#$hour * 60 + 10#$minute))

          if (( now_minutes >= 90 && now_minutes < 330 )); then
            echo "01:30-05:30 JST は監視停止時間です。"
            exit 0
          fi

          end=$((SECONDS + 1500))
          pass=1

          while true; do
            echo "============================================================"
            echo "DENSE MONITOR PASS ${pass}"
            echo "============================================================"

            python sunrise_watch_actions.py

            remaining=$((end - SECONDS))
            if (( remaining < 120 )); then
              echo "25分監視ウィンドウを終了します"
              break
            fi

            wait=$((60 + RANDOM % 31))
            echo "${wait}秒後に新しいセッションで再確認します"
            sleep "$wait"
            pass=$((pass + 1))
          done

      - name: Ensure monitor state exists
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true)
        run: mkdir -p .state && test -f .state/sunrise_state.json || echo '{}' > .state/sunrise_state.json

      - name: Save monitor state
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true)
        uses: actions/cache/save@v4
        with:
          path: .state
          key: sunrise-state-${{ github.run_id }}
      DEPART_MINUTE: ${{ secrets.DEPART_MINUTE }}
      STATE_FILE: .state/sunrise_state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: sunrise-state-${{ github.run_id }}
          restore-keys: |
            sunrise-state-

      - name: Install Python package
        run: python -m pip install -r requirements.txt

      - name: Install Chromium OS dependencies
        run: python -m playwright install-deps chromium

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run ntfy test
        if: github.event_name == 'workflow_dispatch' && inputs.test_ntfy == true
        run: python sunrise_watch_actions.py --test-ntfy

      # scheduleの1回が落ちても監視間隔が開きすぎないよう、
      # 1つのActions runの中で約3分半、複数回確認する。
      # 通常時はおおむね1～2分台で次の確認になる。
      # Python自身がe5489一時エラー時に再試行するため、
      # エラーが多い時は1回の確認に時間がかかり、回数は減る。
      - name: Monitor e5489 for 3.5 minutes
        if: github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true
        shell: bash
        run: |
          end=$((SECONDS + 210))
          pass=1

          while true; do
            echo "============================================================"
            echo "MONITOR PASS ${pass}"
            echo "============================================================"

            python sunrise_watch_actions.py

            remaining=$((end - SECONDS))
            if [ "$remaining" -lt 70 ]; then
              echo "監視ウィンドウ終了"
              break
            fi

            echo "60秒後にもう一度確認します"
            sleep 60
            pass=$((pass + 1))
          done

      - name: Ensure monitor state exists
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true)
        run: mkdir -p .state && test -f .state/sunrise_state.json || echo '{}' > .state/sunrise_state.json

      - name: Save monitor state
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true)
        uses: actions/cache/save@v4
        with:
          path: .state
          key: sunrise-state-${{ github.run_id }}
