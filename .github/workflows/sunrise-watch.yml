name: Sunrise Izumo Watch

on:
  schedule:
    - cron: '7-59/5 * * * *'

  workflow_dispatch:
    inputs:
      test_ntfy:
        description: 'e5489を見ずにntfyだけテストする'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sunrise-izumo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    env:
      NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
      TRIP_LABEL: ${{ secrets.TRIP_LABEL }}
      DEPART_STATION: ${{ secrets.DEPART_STATION }}
      ARRIVE_STATION: ${{ secrets.ARRIVE_STATION }}
      TRAVEL_DATE: ${{ secrets.TRAVEL_DATE }}
      DEPART_HOUR: ${{ secrets.DEPART_HOUR }}
      DEPART_MINUTE: ${{ secrets.DEPART_MINUTE }}
      STATE_FILE: .state/sunrise_state.json
      SUNRISE_MAX_ATTEMPTS: '10'
      SUNRISE_SIGNAL_EXIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: sunrise-state-${{ github.run_id }}
          restore-keys: |
            sunrise-state-

      - name: Install Python package
        run: python -m pip install -r requirements.txt

      - name: Install Chromium OS dependencies
        run: python -m playwright install-deps chromium

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run ntfy test
        if: github.event_name == 'workflow_dispatch' && inputs.test_ntfy == true
        run: python sunrise_watch_actions.py --test-ntfy

      - name: Stable dense monitor
        if: github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true
        shell: bash
        run: |
          end=$((SECONDS + 3300))
          pass=1
          error_streak=0

          while true; do
            hour=$(TZ=Asia/Tokyo date +%H)
            minute=$(TZ=Asia/Tokyo date +%M)
            now_minutes=$((10#$hour * 60 + 10#$minute))

            if (( now_minutes >= 90 && now_minutes < 330 )); then
              echo "01:30-05:30 JST は監視停止時間です。"
              break
            fi

            echo "============================================================"
            echo "STABLE DENSE PASS ${pass}"
            echo "============================================================"

            set +e
            python sunrise_watch_actions.py
            rc=$?
            set -e

            remaining=$((end - SECONDS))
            if (( remaining < 150 )); then
              echo "55分監視ウィンドウを終了します"
              break
            fi

            if (( rc == 2 )); then
              error_streak=$((error_streak + 1))
              if (( error_streak == 1 )); then
                wait=$((120 + RANDOM % 31))
              elif (( error_streak == 2 )); then
                wait=$((180 + RANDOM % 41))
              else
                wait=$((240 + RANDOM % 61))
              fi
              echo "確認不能が ${error_streak} 回連続。${wait}秒休んで再確認します"
            else
              error_streak=0
              wait=$((80 + RANDOM % 31))
              echo "確認完遂。${wait}秒後に新しいセッションで再確認します"
            fi

            if (( remaining <= wait + 60 )); then
              echo "残り時間が少ないため終了します"
              break
            fi

            sleep "$wait"
            pass=$((pass + 1))
          done

      - name: Ensure monitor state exists
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true)
        run: mkdir -p .state && test -f .state/sunrise_state.json || echo '{}' > .state/sunrise_state.json

      - name: Save monitor state
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.test_ntfy != true)
        uses: actions/cache/save@v4
        with:
          path: .state
          key: sunrise-state-${{ github.run_id }}
